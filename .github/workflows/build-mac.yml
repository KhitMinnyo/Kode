name: Build macOS (.dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build .dmg (universal)
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID on this project (see README) — don't let
          # electron-builder search the runner for a signing identity that
          # isn't there. The build stays unsigned/ad-hoc, same as local builds.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kode-mac-universal-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only run on an actual tag push - GitHub Releases requires a tag to
    # attach to, so a workflow_dispatch run on a branch (used to test that
    # the build step itself works) intentionally skips this job.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kode-mac-universal-dmg
          path: artifacts

      # softprops/action-gh-release updates the existing release for this tag
      # (e.g. the one build-linux.yml's release job already created for the
      # same tag push) rather than failing or replacing it, so the Linux
      # .deb and the macOS .dmg end up as two files on one release.
      # No `body`/`generate_release_notes` here on purpose: this project's
      # releases are hand-written (see the *-release-notes.md files) and
      # published manually first, so this step must only ATTACH the dmg to
      # whatever release already exists for the tag, never touch its notes.
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
