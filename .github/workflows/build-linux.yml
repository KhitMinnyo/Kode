name: Build Linux (.deb)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build .deb package (${{ matrix.arch }})
        run: npx electron-builder --linux deb --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kode-linux-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only run on an actual tag push - GitHub Releases requires a tag to
    # attach to, so a workflow_dispatch run on a branch (used to test that
    # the build step itself works) intentionally skips this job.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # No `generate_release_notes` here on purpose - same reasoning as
      # build-mac.yml: releases for this project are hand-written and
      # published manually first, so this step must only ATTACH the .deb
      # files to whatever release already exists for the tag, never touch
      # its notes.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
